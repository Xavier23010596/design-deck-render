name: 功能请求
description: 新增版式原型、动效、参数或文档改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持"零依赖、离线可用"。以下类型的请求通常不会接受：
        引入前端框架 / CSS 库 / 字体 CDN / 统计脚本；复制某个网站的源码或资源；
        导出 pptx / pdf。

  - type: dropdown
    id: kind
    attributes:
      label: 请求类型
      options:
        - 新增版式原型
        - 动效 / 节奏调整
        - 运行时参数（SKILL.md §2）
        - 无障碍 / 兼容性
        - 文档改进
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你要解决什么问题
      description: 描述场景，不要只描述解法。
      placeholder: 我的内容里有一页要同时展示"尺寸 + 重量 + 价格"三个并列数字，现有原型只能放一个。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
      description: 如果有具体想法，写在这里；接受"我没有方案，只想说明问题"。
    validations:
      required: false

  - type: textarea
    id: alternative
    attributes:
      label: 你试过的替代方案
      description: 例如：把三个数字拆成三页、改用图版截图等。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 该请求不需要引入外部依赖或在线资源
          required: true
        - label: 该请求不涉及复制第三方页面/资源
          required: true
